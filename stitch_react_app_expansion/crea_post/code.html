<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                    "on-secondary-container": "#6c5000",
                    "surface-container": "#e6effa",
                    "on-secondary": "#ffffff",
                    "on-primary-fixed": "#00201b",
                    "tertiary-fixed": "#d8e2ff",
                    "surface": "#f7f9ff",
                    "secondary-fixed": "#ffdf9e",
                    "inverse-on-surface": "#e9f2fd",
                    "on-tertiary-fixed": "#001a41",
                    "tertiary": "#004290",
                    "surface-tint": "#046b5e",
                    "outline-variant": "#bec9c5",
                    "on-surface": "#141c25",
                    "surface-container-highest": "#dae3ef",
                    "on-error": "#ffffff",
                    "on-surface-variant": "#3e4946",
                    "on-secondary-fixed-variant": "#5b4300",
                    "on-tertiary-container": "#c5d6ff",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary": "#ffffff",
                    "primary": "#004f45",
                    "secondary-fixed-dim": "#fabd00",
                    "surface-variant": "#dae3ef",
                    "on-secondary-fixed": "#261a00",
                    "on-background": "#141c25",
                    "inverse-primary": "#84d5c5",
                    "surface-container-low": "#ecf4ff",
                    "inverse-surface": "#29313a",
                    "secondary-container": "#fdc003",
                    "tertiary-fixed-dim": "#adc6ff",
                    "on-primary": "#ffffff",
                    "on-tertiary-fixed-variant": "#004493",
                    "on-primary-fixed-variant": "#005046",
                    "primary-fixed-dim": "#84d5c5",
                    "primary-container": "#00695c",
                    "surface-dim": "#d2dbe6",
                    "tertiary-container": "#0059bd",
                    "error-container": "#ffdad6",
                    "on-error-container": "#93000a",
                    "primary-fixed": "#a0f2e1",
                    "surface-container-high": "#e0e9f5",
                    "surface-bright": "#f7f9ff",
                    "background": "#f7f9ff",
                    "outline": "#6e7976",
                    "on-primary-container": "#94e5d5",
                    "error": "#ba1a1a"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Plus Jakarta Sans"],
                    "body": ["Inter"],
                    "label": ["Space Grotesk"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; }
        .label-text { font-family: 'Space Grotesk', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-white/80 dark:bg-emerald-950/80 backdrop-blur-md">
<nav class="flex justify-between items-center px-6 py-4 w-full max-w-2xl mx-auto">
<button class="flex items-center justify-center text-teal-700 dark:text-teal-300 hover:bg-emerald-100 dark:hover:bg-emerald-800 transition-colors rounded-full p-2 active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-plus-jakarta text-lg font-bold text-teal-900 dark:text-teal-50">New Post</h1>
<button class="px-5 py-2 bg-primary text-on-primary font-headline font-bold rounded-full hover:bg-primary-container transition-colors active:scale-95 duration-200 shadow-lg shadow-primary/10">
                Post
            </button>
</nav>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-20 px-6 pb-24 max-w-2xl mx-auto w-full">
<!-- User Context Header -->
<div class="flex items-center gap-4 mb-8">
<div class="w-12 h-12 rounded-full overflow-hidden border-2 border-primary/10">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="portrait of a professional man with a friendly expression in soft natural lighting outdoor setting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBQzW-Mw5-9huq12kB8AT4lVSLkiUvdhV1WdNf6JbnuWKBp5NtvMafrCzb0AWJ_W30t9rVc7lpHN2oSaExNZOKSDXAOjkcn_Xd23e0Hu-s6gvL0m-zewiJPYMfdojbniy2PloRcVdIbwilQFhINCCI7ZhV7Oa3J4DZQODHWpeF6M0tdvTneyVreC94dUCrpjqtHMWEw6PelNjcXSpJrZu69AJ4eEW3-EaJ7p_8y6ZxWA96WOid0YF_Bvf508AV6PJT0jFl1yeUWx2c"/>
</div>
<div>
<h3 class="font-headline font-bold text-on-surface leading-tight">Marco Valeri</h3>
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-sm text-secondary" data-icon="location_on">location_on</span>
<span class="label-text text-[10px] uppercase tracking-wider text-on-surface-variant font-medium">A1 Autostrada del Sole</span>
</div>
</div>
</div>
<!-- Compose Section -->
<div class="relative flex flex-col gap-6">
<!-- Media Attachment Toolbar -->
<div class="flex gap-3">
<button class="flex items-center gap-2 px-4 py-3 bg-surface-container-low hover:bg-surface-container-high transition-colors rounded-full group">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform" data-icon="add_photo_alternate">add_photo_alternate</span>
<span class="label-text text-sm font-semibold text-primary">Add Photo</span>
</button>
<button class="flex items-center gap-2 px-4 py-3 bg-surface-container-low hover:bg-surface-container-high transition-colors rounded-full group">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform" data-icon="videocam">videocam</span>
<span class="label-text text-sm font-semibold text-primary">Add Video</span>
</button>
</div>
<!-- Editor Surface -->
<div class="relative bg-surface-container-lowest rounded-lg p-6 min-h-[300px] shadow-sm ring-1 ring-black/[0.03]">
<textarea class="w-full min-h-[200px] bg-transparent border-none focus:ring-0 text-xl font-body text-on-surface placeholder:text-outline-variant resize-none" placeholder="What's happening on the road?"></textarea>
<!-- Character Counter -->
<div class="absolute bottom-6 right-6 flex items-center gap-2">
<div class="w-12 h-12 relative flex items-center justify-center">
<svg class="w-full h-full -rotate-90">
<circle class="text-surface-container-high" cx="24" cy="24" fill="none" r="20" stroke="currentColor" stroke-width="2"></circle>
<circle class="text-secondary transition-all duration-300" cx="24" cy="24" fill="none" r="20" stroke="currentColor" stroke-dasharray="125" stroke-dashoffset="125" stroke-width="2"></circle>
</svg>
<span class="absolute label-text text-[10px] font-bold text-on-surface-variant">0/280</span>
</div>
</div>
</div>
<!-- Bento Preview Section (Asymmetric) -->
<div class="grid grid-cols-12 gap-4 h-48">
<div class="col-span-8 bg-surface-container-low rounded-lg overflow-hidden relative group cursor-pointer border-2 border-dashed border-outline-variant/30 flex items-center justify-center">
<div class="text-center opacity-40 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-3xl block mb-1" data-icon="add_a_photo">add_a_photo</span>
<span class="label-text text-xs uppercase tracking-widest font-bold">Main Visual</span>
</div>
</div>
<div class="col-span-4 flex flex-col gap-4">
<div class="flex-1 bg-secondary-container/10 rounded-lg border-2 border-dashed border-secondary/20 flex items-center justify-center">
<span class="material-symbols-outlined text-secondary opacity-40" data-icon="sell">sell</span>
</div>
<div class="flex-1 bg-tertiary-fixed/30 rounded-lg border-2 border-dashed border-tertiary/20 flex items-center justify-center">
<span class="material-symbols-outlined text-tertiary opacity-40" data-icon="alternate_email">alternate_email</span>
</div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar (Hidden on desktop, simplified for compose screen) -->
<nav class="fixed bottom-0 w-full flex justify-around items-center px-6 pb-8 pt-4 bg-white/80 dark:bg-emerald-950/80 backdrop-blur-md rounded-t-3xl z-50 border-t border-teal-500/10 shadow-[0_-4px_24px_rgba(0,79,69,0.06)] md:hidden">
<button class="flex items-center justify-center text-teal-700 dark:text-teal-400 p-3 hover:text-amber-600 dark:hover:text-amber-400 transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="explore">explore</span>
</button>
<button class="flex items-center justify-center text-teal-700 dark:text-teal-400 p-3 hover:text-amber-600 dark:hover:text-amber-400 transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="map">map</span>
</button>
<button class="flex items-center justify-center bg-amber-400 dark:bg-amber-500 text-teal-950 rounded-full p-3 shadow-lg shadow-amber-500/20 active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="add_circle">add_circle</span>
</button>
<button class="flex items-center justify-center text-teal-700 dark:text-teal-400 p-3 hover:text-amber-600 dark:hover:text-amber-400 transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="reviews">reviews</span>
</button>
<button class="flex items-center justify-center text-teal-700 dark:text-teal-400 p-3 hover:text-amber-600 dark:hover:text-amber-400 transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="person">person</span>
</button>
</nav>
<!-- FAB Suppression: This page does not feature a FAB to avoid interaction conflict with the 'Post' button -->
</body></html>
