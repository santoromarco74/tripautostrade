<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>TripAutostrade — Reimposta password</title>
  <link rel="icon" type="image/png" href="icon.png">
  <style>
    :root {
      --primary: #00695C;
      --primary-dark: #004D40;
      --accent: #FFC107;
      --bg: #F5F7FA;
      --surface: #FFFFFF;
      --text: #1E293B;
      --text-secondary: #64748B;
      --border: #E2E8F0;
      --error: #B91C1C;
      --ok: #047857;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--surface);
      border-radius: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
      padding: 36px 28px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .card img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 16px; }
    h1 { font-size: 1.35rem; margin-bottom: 6px; }
    .sub { color: var(--text-secondary); font-size: .92rem; margin-bottom: 24px; }
    label { display: block; text-align: left; font-size: .82rem; font-weight: 600; color: var(--text-secondary); margin: 12px 0 4px; }
    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 1rem;
      background: #FAFAFA;
      color: var(--text);
    }
    input:focus { outline: 2px solid var(--primary); border-color: transparent; }
    button {
      width: 100%;
      margin-top: 22px;
      background: var(--primary);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      border: none;
      border-radius: 28px;
      padding: 14px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: default; }
    .msg { margin-top: 16px; font-size: .9rem; display: none; }
    .msg.error { color: var(--error); display: block; }
    .msg.ok { color: var(--ok); display: block; font-weight: 600; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <img src="icon.png" alt="TripAutostrade">
    <h1>Reimposta la password</h1>

    <div id="form-box">
      <p class="sub">Scegli la nuova password per il tuo account TripAutostrade.</p>
      <form id="reset-form">
        <label for="pw1">Nuova password (min. 6 caratteri)</label>
        <input type="password" id="pw1" autocomplete="new-password" required minlength="6">
        <label for="pw2">Ripeti la nuova password</label>
        <input type="password" id="pw2" autocomplete="new-password" required minlength="6">
        <button type="submit" id="submit-btn">Salva la nuova password</button>
      </form>
    </div>

    <div id="done-box" class="hidden">
      <p class="sub">✅ Password aggiornata!<br>Ora torna nell'app TripAutostrade e accedi con la nuova password.</p>
    </div>

    <p class="msg" id="msg"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://gkyahazhuvtiqersqlmh.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_4iee5t_pvQt5ZMGOnkcuWA_CENLTuFZ';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const msg = document.getElementById('msg');
    const form = document.getElementById('reset-form');
    const btn = document.getElementById('submit-btn');

    function showError(text) { msg.textContent = text; msg.className = 'msg error'; }

    // Il link nell'email arriva qui con i token nel fragment (#access_token=...):
    // supabase-js li consuma automaticamente (detectSessionInUrl) creando la sessione.
    let recoveryReady = false;
    client.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) {
        recoveryReady = true;
        msg.className = 'msg';
      }
    });

    // Se dopo un attimo non c'è sessione, il link è mancante o scaduto
    setTimeout(async () => {
      const { data } = await client.auth.getSession();
      if (!data.session && !recoveryReady) {
        showError('Link non valido o scaduto. Torna nell\'app e richiedi di nuovo "Password dimenticata?".');
        btn.disabled = true;
      }
    }, 1500);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw1 = document.getElementById('pw1').value;
      const pw2 = document.getElementById('pw2').value;
      if (pw1.length < 6) { showError('La password deve avere almeno 6 caratteri.'); return; }
      if (pw1 !== pw2) { showError('Le due password non coincidono.'); return; }

      btn.disabled = true;
      btn.textContent = 'Salvataggio…';
      const { error } = await client.auth.updateUser({ password: pw1 });
      if (error) {
        showError('Errore: ' + error.message);
        btn.disabled = false;
        btn.textContent = 'Salva la nuova password';
        return;
      }
      document.getElementById('form-box').classList.add('hidden');
      document.getElementById('done-box').classList.remove('hidden');
      msg.className = 'msg';
      client.auth.signOut();
    });
  </script>
</body>
</html>
